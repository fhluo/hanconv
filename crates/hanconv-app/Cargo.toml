[package]
name = "hanconv-app"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Convert between Chinese characters variants."
categories = ["text-processing", "gui"]
keywords = ["chinese", "simplified-chinese", "traditional-chinese"]
repository = "https://github.com/fhluo/hanconv"
license = "MIT"
exclude = ["justfile"]

[dependencies]
hanconv = "0.5"
gpui-kit = "0.6"
rust-i18n = "3.1"
sys-locale = "0.3"
icu_locale = { version = "2.1", features = ["compiled_data", "serde"] }
confy = { version = "2.0" }
rust-embed = "8.11"
dirs = "7.0"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
schemars = { version = "1.2", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
anyhow = "1.0"

[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
FileDescription = "Hanconv"
ProductName = "Hanconv"
LegalCopyright = "Copyright © 2022 fhluo"
