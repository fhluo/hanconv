[package]
name = "hanconv-tauri"
version = "0.4.2"
edition = "2024"

[lib]
name = "app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.1", features = ["macos-private-api"] }
tauri-runtime-wry = { version = "3.0.0-alpha.1", features = ["macos-private-api"] }
tauri-plugin-opener = "3.0.0-alpha.0"
tauri-plugin-dialog = "3.0.0-alpha.0"
tauri-plugin-fs = "3.0.0-alpha.0"
tauri-plugin-process = "3.0.0-alpha.0"
tauri-plugin-store = "3.0.0-alpha.0"
tauri-plugin-clipboard-manager = "3.0.0-alpha.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hanconv = { workspace = true }
window-vibrancy = "0.8"
encoding_rs = "0.8"
charset-normalizer-rs = "1.1"
thiserror = "2.0"
