name: Release

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""

      - name: Set up Task
        run: |
          winget install --id Task.Task --accept-source-agreements --accept-package-agreements
          "$env:LOCALAPPDATA\Microsoft\WinGet\Links" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Build
        run: |
          task cli:build
          task app:build

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/hanconv.exe
            target/release/hanconv-app.exe
