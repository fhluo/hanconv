[package]
name = "hanconv-wasm"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Convert between Chinese character variants."
categories = ["text-processing", "command-line-utilities"]
keywords = ["chinese", "simplified-chinese", "traditional-chinese"]
repository = "https://github.com/fhluo/hanconv"
license = "MIT"
include = ["src/**", "LICENSE", "README.md"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["ahash"]
ahash = ["hanconv/ahash", "dep:getrandom"]

[dependencies]
hanconv = { workspace = true, default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
