[package]
name = "hanconv-py"
version = "0.3.0"
edition = "2024"

[lib]
name = "hanconv"
crate-type = ["cdylib"]

[features]
default = ["ahash"]
ahash = ["hanconv/ahash"]

[dependencies]
hanconv = { workspace = true, default-features = false }
pyo3 = { version = "0.30", features = ["extension-module"] }
