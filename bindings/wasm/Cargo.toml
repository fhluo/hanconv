[package]
name = "hanconv-wasm"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["ahash"]
ahash = ["hanconv/ahash", "dep:getrandom"]

[dependencies]
hanconv = { workspace = true, default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
