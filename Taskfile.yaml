# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

includes:
  cli:
    taskfile: crates/hanconv-cli/Taskfile.yaml
    dir: crates/hanconv-cli
  app:
    taskfile: crates/hanconv-app/Taskfile.yaml
    dir: crates/hanconv-app
  tauri:
    taskfile: app/Taskfile.yaml
    dir: app
  web:
    taskfile: web/Taskfile.yaml
    dir: web
  go:
    taskfile: go/Taskfile.yaml
    dir: go

tasks:
  setup:
    deps:
      - task: web:setup
      - task: app:setup

  build:
    deps:
      - task: go:build
      - task: cli:build
      - task: app:build

  debug:
    deps:
      - task: app:debug

  dev:
    deps:
      - task: app:dev

  update:
    deps:
      - task: go:update
      - task: web:update
    cmds:
      - cargo update
